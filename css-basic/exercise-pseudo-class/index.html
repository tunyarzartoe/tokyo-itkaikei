<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擬似クラス</title>
    <style>
        body.pseudo-class {
            font-family: Arial, sans-serif;
        }
        
        a:link {
            color: red;
        }

        a:visited {
            color: gray;
        }

        a:hover {
            color: orange;
        }

        a:active {
            color: yellow;
        }
    </style>
</head>

<body class="pseudo-class">
    <a href="#">リンク</a>
</body>

</html>
